unbind C-b
set -g prefix `
bind-key ` last-window
bind-key e send-prefix

# Minimal top status: [session] window:name
set -g status-position top
set -g status-justify left
set -g status-style 'fg=colour245,bg=default'
set -g status-left '[#S] '
set -g status-left-style 'fg=colour245,bg=default'
set -g status-left-length 32
set -g status-right ''
set -g window-status-separator ' '
setw -g window-status-format '#I:#W'
setw -g window-status-current-format '#I:#W'
setw -g window-status-style 'fg=colour240,bg=default'
setw -g window-status-current-style 'fg=colour250,bg=default,bold'

setw -g mode-keys vi

set-option -g history-limit 5000
set -g mouse on
